<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sistema de Recursos Humanos</title>
  <meta name="description" content="Sistema integral de gestión de Recursos Humanos" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app">
    <!-- ===================== SIDEBAR ===================== -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar__logo" title="Recursos Humanos">
        <span class="sidebar__logo-mark">RH</span>
      </div>

      <nav class="sidebar__nav" aria-label="Navegación principal">
        <button class="nav-btn is-active" data-tip="Inicio" aria-label="Inicio">
          <svg viewBox="0 0 24 24" fill="none"><path d="M3 10.5 12 3l9 7.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 9.5V20a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="nav-btn" data-tip="Documentos" aria-label="Documentos">
          <svg viewBox="0 0 24 24" fill="none"><path d="M6 3h8l4 4v14a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M14 3v4h4M8 12h8M8 16h6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
        <button class="nav-btn" data-tip="Favoritos" aria-label="Favoritos">
          <svg viewBox="0 0 24 24" fill="none"><path d="m12 4 2.5 5 5.5.8-4 3.9.9 5.5L12 16.9 7.1 19.2l.9-5.5-4-3.9L9.5 9 12 4Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        </button>
        <button class="nav-btn" data-tip="Áreas" aria-label="Áreas">
          <svg viewBox="0 0 24 24" fill="none"><path d="M3 7a1 1 0 0 1 1-1h5l2 2h8a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V7Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        </button>
        <button class="nav-btn" data-tip="Reportes" aria-label="Reportes">
          <svg viewBox="0 0 24 24" fill="none"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
        <button class="nav-btn" data-tip="Manual" aria-label="Manual">
          <svg viewBox="0 0 24 24" fill="none"><path d="M4 5a2 2 0 0 1 2-2h6v18H6a2 2 0 0 1-2-2V5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M20 5a2 2 0 0 0-2-2h-6v18h6a2 2 0 0 0 2-2V5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        </button>
      </nav>

      <div class="sidebar__bottom">
        <button class="nav-btn" data-tip="Configuración" aria-label="Configuración">
          <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6"/><path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1 7 17M17 7l2.1-2.1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
      </div>
    </aside>

    <!-- ===================== MAIN ===================== -->
    <main class="main">
      <header class="topbar">
        <div class="topbar__crumbs">
          <span class="crumb">Recursos Humanos</span>
          <span class="crumb-sep">/</span>
          <span class="crumb crumb--current">Panel principal</span>
        </div>
        <div class="topbar__actions">
          <div class="search">
            <svg viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.6"/><path d="m20 20-3.5-3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
            <input type="text" placeholder="Buscar módulo o trámite…" aria-label="Buscar" id="searchInput" />
          </div>
          <button class="icon-btn" aria-label="Notificaciones">
            <svg viewBox="0 0 24 24" fill="none"><path d="M6 9a6 6 0 0 1 12 0c0 5 2 6 2 6H4s2-1 2-6Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M10 19a2 2 0 0 0 4 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
            <span class="dot"></span>
          </button>
          <div class="avatar" title="Mi cuenta">HM</div>
        </div>
      </header>

      <section class="hero">
        <div class="hero__text">
          <h1 class="hero__title">Bienvenido al Sistema de <span>Recursos Humanos</span></h1>
          <p class="hero__subtitle">Selecciona un panel para gestionar los trámites y procesos del personal.</p>
        </div>
      </section>

      <section class="panels" aria-label="Paneles de acceso">
        <div class="panels__grid" id="panelsGrid">
          <!-- Las tarjetas se generan dinámicamente desde js/panels.js -->
        </div>
      </section>

      <footer class="footer">
        <span>Sistema de Recursos Humanos</span>
        <span class="footer__sep">•</span>
        <span>Versión 0.1 — en construcción</span>
      </footer>
    </main>
  </div>

  <script src="js/panels.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
