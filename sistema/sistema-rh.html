<title>Sistema de Recursos Humanos</title>
<style>
  :root {
    --bg-0:#070a14; --bg-1:#0b1020; --bg-2:#0e1428;
    --surface:rgba(255,255,255,.04); --surface-strong:rgba(255,255,255,.07);
    --border:rgba(255,255,255,.09); --border-strong:rgba(255,255,255,.16);
    --text:#e8edf7; --text-soft:#aab4cc; --text-dim:#6b7690;
    --teal-1:#34e0c4; --teal-2:#2bb0ff; --violet-1:#9b7bff; --violet-2:#6a5cff;
    --blue-1:#64b5ff; --blue-2:#4d7cff; --amber-1:#ffcf6e; --amber-2:#ff9d5c;
    --green:#41d18a; --yellow:#ffd76e; --orange:#ff9d5c; --red:#ff6b7d;
    --radius:20px; --shadow:0 24px 60px -20px rgba(0,0,0,.7); --sidebar-w:76px; --maxw:1320px;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; padding:0; min-height:100%; }
  body {
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    color:var(--text);
    background:
      radial-gradient(900px 600px at 78% -10%, rgba(107,92,255,.20), transparent 60%),
      radial-gradient(800px 620px at 8% 8%, rgba(43,176,255,.16), transparent 55%),
      radial-gradient(1000px 700px at 60% 120%, rgba(52,224,196,.12), transparent 60%),
      linear-gradient(180deg, var(--bg-1), var(--bg-0));
    background-attachment:fixed; -webkit-font-smoothing:antialiased;
  }
  .app { display:grid; grid-template-columns:var(--sidebar-w) 1fr; min-height:100vh; }

  /* Sidebar */
  .sidebar { position:sticky; top:0; height:100vh; display:flex; flex-direction:column; align-items:center;
    gap:8px; padding:18px 0 20px; background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.01));
    border-right:1px solid var(--border); backdrop-filter:blur(14px); z-index:20; }
  .logo { width:46px; height:46px; border-radius:14px; display:grid; place-items:center; margin-bottom:14px;
    background:linear-gradient(135deg, var(--teal-1), var(--violet-2)); color:#071019; font-weight:800; font-size:16px;
    box-shadow:0 8px 24px -6px rgba(106,92,255,.7), inset 0 0 0 1px rgba(255,255,255,.2); cursor:pointer; border:none; }
  .snav { display:flex; flex-direction:column; gap:6px; width:100%; align-items:center; }
  .sbottom { margin-top:auto; }
  .nav-btn { position:relative; width:44px; height:44px; border:1px solid transparent; border-radius:13px; background:transparent;
    color:var(--text-dim); cursor:pointer; display:grid; place-items:center; transition:.2s; }
  .nav-btn svg { width:21px; height:21px; }
  .nav-btn:hover { color:var(--text); background:var(--surface-strong); border-color:var(--border); }
  .nav-btn.active { color:#d7fff6; background:linear-gradient(135deg, rgba(52,224,196,.18), rgba(106,92,255,.18)); border-color:var(--border-strong); }
  .nav-btn.active::before { content:""; position:absolute; left:-12px; top:50%; transform:translateY(-50%); width:3px; height:22px; border-radius:3px; background:linear-gradient(180deg,var(--teal-1),var(--violet-1)); }
  .nav-btn::after { content:attr(data-tip); position:absolute; left:54px; top:50%; transform:translateY(-50%) translateX(-6px);
    background:var(--bg-2); color:var(--text); font-size:12px; white-space:nowrap; padding:6px 10px; border-radius:8px;
    border:1px solid var(--border); opacity:0; pointer-events:none; transition:.15s; z-index:30; }
  .nav-btn:hover::after { opacity:1; transform:translateY(-50%) translateX(0); }

  /* Main */
  .main { padding:22px clamp(16px,4vw,44px) 40px; width:100%; max-width:calc(var(--maxw) + 88px); margin:0 auto; }
  .topbar { display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:26px; }
  .crumbs { display:flex; align-items:center; gap:8px; font-size:13.5px; flex-wrap:wrap; }
  .crumb { color:var(--text-dim); background:none; border:none; padding:0; font:inherit; cursor:pointer; }
  .crumb.current { color:var(--text); font-weight:600; cursor:default; }
  .crumb.link:hover { color:var(--text); text-decoration:underline; }
  .tb-actions { display:flex; align-items:center; gap:12px; }
  .avatar { width:42px; height:42px; border-radius:12px; display:grid; place-items:center; font-weight:700; font-size:14px;
    color:#071019; background:linear-gradient(135deg,var(--blue-1),var(--violet-1)); border:1px solid rgba(255,255,255,.2); }

  /* Hero */
  .hero { margin-bottom:26px; }
  .hero h1 { font-size:clamp(24px,3.4vw,36px); font-weight:800; letter-spacing:-.5px; margin:0 0 8px; line-height:1.12; }
  .hero h1 span { background:linear-gradient(90deg,var(--teal-1),var(--violet-1)); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
  .hero p { margin:0; color:var(--text-soft); font-size:15px; max-width:620px; }

  /* Grid de paneles */
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:20px; }
  .card { position:relative; display:flex; gap:16px; padding:22px; border-radius:var(--radius);
    background:linear-gradient(160deg,var(--surface-strong),var(--surface)); border:1px solid var(--border);
    text-align:left; color:inherit; overflow:hidden; box-shadow:var(--shadow); backdrop-filter:blur(12px); cursor:pointer;
    font-family:inherit; transition:transform .28s cubic-bezier(.2,.7,.2,1), border-color .28s, box-shadow .28s; animation:cardIn .5s both; }
  @keyframes cardIn { from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);} }
  .card:hover { transform:translateY(-5px); border-color:var(--border-strong); box-shadow:0 34px 70px -22px rgba(0,0,0,.8); }
  .card .glow { position:absolute; inset:-1px -1px auto -1px; height:120px;
    background:radial-gradient(220px 120px at 30% -30%, rgba(120,160,255,.22), transparent 70%); opacity:0; transition:.3s; pointer-events:none; }
  .card:hover .glow { opacity:1; }
  .cicon { flex:none; width:56px; height:56px; border-radius:16px; display:grid; place-items:center; color:#06121a;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.25), 0 10px 26px -8px rgba(0,0,0,.6); }
  .cicon svg { width:28px; height:28px; }
  .icon-teal { background:linear-gradient(140deg,var(--teal-1),var(--teal-2)); }
  .icon-violet { background:linear-gradient(140deg,var(--violet-1),var(--violet-2)); }
  .icon-blue { background:linear-gradient(140deg,var(--blue-1),var(--blue-2)); }
  .icon-amber { background:linear-gradient(140deg,var(--amber-1),var(--amber-2)); }
  .cbody { flex:1; min-width:0; }
  .chead { display:flex; align-items:center; gap:10px; margin-bottom:8px; flex-wrap:wrap; }
  .ctitle { margin:0; font-size:17px; font-weight:700; letter-spacing:-.2px; }
  .csum { margin:0; color:var(--text-soft); font-size:13.5px; line-height:1.5; }
  .badge { font-size:11px; font-weight:600; padding:3px 9px; border-radius:999px; color:var(--text); border:1px solid var(--border); background:var(--surface); }
  .badge-teal { color:#b9fff2; border-color:rgba(52,224,196,.35); background:rgba(52,224,196,.10); }
  .badge-violet { color:#d8ccff; border-color:rgba(155,123,255,.35); background:rgba(155,123,255,.10); }
  .badge-soft { color:var(--text-soft); }
  .carrow { flex:none; align-self:center; width:34px; height:34px; border-radius:10px; display:grid; place-items:center;
    color:var(--text-dim); border:1px solid transparent; transition:.25s; }
  .carrow svg { width:18px; height:18px; }
  .card:hover .carrow { color:var(--text); transform:translateX(3px); border-color:var(--border); background:var(--surface); }

  /* Vista detalle genérica */
  .back { display:inline-flex; align-items:center; gap:8px; color:var(--text-soft); font:inherit; font-size:14px;
    padding:8px 14px; border-radius:10px; border:1px solid var(--border); background:var(--surface); cursor:pointer; transition:.2s; }
  .back:hover { color:var(--text); background:var(--surface-strong); border-color:var(--border-strong); }
  .back svg { width:16px; height:16px; }
  .dhead { display:flex; align-items:center; gap:18px; margin:26px 0 6px; }
  .dicon { flex:none; width:64px; height:64px; border-radius:18px; display:grid; place-items:center; color:#06121a; box-shadow:inset 0 0 0 1px rgba(255,255,255,.25); }
  .dicon svg { width:32px; height:32px; }
  .dhead h1 { margin:0 0 4px; font-size:clamp(22px,3vw,30px); font-weight:800; letter-spacing:-.4px; }
  .dhead p { margin:0; color:var(--text-soft); font-size:14.5px; max-width:720px; }
  .dcard { margin-top:24px; padding:28px; border-radius:var(--radius); background:linear-gradient(160deg,var(--surface-strong),var(--surface));
    border:1px solid var(--border); box-shadow:var(--shadow); }
  .dcard h2 { margin:0 0 10px; font-size:18px; }
  .dcard p { margin:0; color:var(--text-soft); line-height:1.6; }
  .chip { display:inline-flex; align-items:center; gap:7px; font-size:12px; font-weight:600; padding:5px 12px; border-radius:999px;
    color:#ffe6c2; border:1px solid rgba(255,207,110,.35); background:rgba(255,207,110,.10); margin-top:18px; }
  .chip::before { content:""; width:7px; height:7px; border-radius:50%; background:var(--amber-1); }

  /* ===== Módulo Comisión ===== */
  .subtabs { display:flex; gap:6px; margin:22px 0 20px; flex-wrap:wrap; border-bottom:1px solid var(--border); padding-bottom:0; }
  .subtab { position:relative; background:none; border:none; color:var(--text-soft); font:inherit; font-size:14px; font-weight:500;
    padding:10px 16px; cursor:pointer; border-radius:10px 10px 0 0; transition:.2s; }
  .subtab:hover { color:var(--text); background:var(--surface); }
  .subtab.active { color:var(--text); font-weight:600; }
  .subtab.active::after { content:""; position:absolute; left:12px; right:12px; bottom:-1px; height:2px; border-radius:2px; background:linear-gradient(90deg,var(--violet-1),var(--teal-1)); }

  /* KPI tiles */
  .kpis { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:16px; }
  .kpi { padding:20px; border-radius:16px; background:linear-gradient(160deg,var(--surface-strong),var(--surface));
    border:1px solid var(--border); box-shadow:var(--shadow); position:relative; overflow:hidden; }
  .kpi .k-top { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .kpi .k-ic { width:34px; height:34px; border-radius:10px; display:grid; place-items:center; color:#06121a; }
  .kpi .k-ic svg { width:18px; height:18px; }
  .kpi .k-num { font-size:30px; font-weight:800; letter-spacing:-.5px; font-variant-numeric:tabular-nums; line-height:1; }
  .kpi .k-lbl { color:var(--text-soft); font-size:13px; margin-top:8px; line-height:1.4; }
  .k-accent-teal::before,.k-accent-violet::before,.k-accent-amber::before,.k-accent-red::before,.k-accent-blue::before,.k-accent-green::before{
    content:""; position:absolute; top:0; left:0; width:3px; height:100%; }
  .k-accent-teal::before{background:var(--teal-1);} .k-accent-violet::before{background:var(--violet-1);}
  .k-accent-amber::before{background:var(--amber-1);} .k-accent-red::before{background:var(--red);}
  .k-accent-blue::before{background:var(--blue-1);} .k-accent-green::before{background:var(--green);}

  /* toolbar */
  .toolbar { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:14px; }
  .search { display:flex; align-items:center; gap:9px; padding:9px 14px; min-width:240px; border-radius:12px;
    background:var(--surface); border:1px solid var(--border); color:var(--text-soft); transition:.2s; }
  .search:focus-within { border-color:var(--border-strong); background:var(--surface-strong); }
  .search svg { width:17px; height:17px; color:var(--text-dim); flex:none; }
  .search input { border:none; outline:none; background:transparent; color:var(--text); font-size:14px; width:100%; font-family:inherit; }
  .search input::placeholder { color:var(--text-dim); }
  .btn { display:inline-flex; align-items:center; gap:8px; padding:10px 16px; border-radius:11px; font:inherit; font-size:14px; font-weight:600;
    cursor:pointer; border:1px solid transparent; transition:.2s; }
  .btn svg { width:17px; height:17px; }
  .btn-primary { color:#071019; background:linear-gradient(135deg,var(--teal-1),var(--violet-1)); }
  .btn-primary:hover { filter:brightness(1.08); transform:translateY(-1px); }
  .btn-ghost { color:var(--text-soft); background:var(--surface); border-color:var(--border); }
  .btn-ghost:hover { color:var(--text); background:var(--surface-strong); border-color:var(--border-strong); }

  /* tabla */
  .tbl-wrap { overflow-x:auto; border-radius:16px; border:1px solid var(--border); background:linear-gradient(160deg,var(--surface-strong),var(--surface)); box-shadow:var(--shadow); }
  table { border-collapse:collapse; width:100%; font-size:13px; min-width:760px; }
  thead th { text-align:left; padding:12px 14px; color:var(--text-soft); font-weight:600; font-size:11.5px; text-transform:uppercase;
    letter-spacing:.4px; border-bottom:1px solid var(--border); white-space:nowrap; background:rgba(255,255,255,.02); position:sticky; top:0; }
  tbody td { padding:11px 14px; border-bottom:1px solid var(--border); vertical-align:middle; }
  tbody tr:last-child td { border-bottom:none; }
  tbody tr:hover { background:rgba(255,255,255,.03); }
  tbody tr.hl { background:rgba(255,215,110,.10); }
  td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .nombre { font-weight:600; color:var(--text); }
  .muted { color:var(--text-dim); }
  .nowrap { white-space:nowrap; }

  /* semáforo pill */
  .pill { display:inline-flex; align-items:center; gap:6px; padding:3px 10px; border-radius:999px; font-size:11.5px; font-weight:600; white-space:nowrap; }
  .pill .d { width:7px; height:7px; border-radius:50%; flex:none; }
  .st-green { color:#bff3d9; background:rgba(65,209,138,.12); border:1px solid rgba(65,209,138,.32);} .st-green .d{background:var(--green);}
  .st-yellow{ color:#ffe9b0; background:rgba(255,215,110,.12); border:1px solid rgba(255,215,110,.32);} .st-yellow .d{background:var(--yellow);}
  .st-orange{ color:#ffd3ad; background:rgba(255,157,92,.12); border:1px solid rgba(255,157,92,.34);} .st-orange .d{background:var(--orange);}
  .st-red{ color:#ffc0c8; background:rgba(255,107,125,.12); border:1px solid rgba(255,107,125,.34);} .st-red .d{background:var(--red);}
  .st-gray{ color:var(--text-soft); background:var(--surface); border:1px solid var(--border);} .st-gray .d{background:var(--text-dim);}

  /* form */
  .form-card { padding:26px; border-radius:16px; background:linear-gradient(160deg,var(--surface-strong),var(--surface));
    border:1px solid var(--border); box-shadow:var(--shadow); max-width:920px; }
  .form-sec-title { font-size:12px; text-transform:uppercase; letter-spacing:.6px; color:var(--text-dim); font-weight:700; margin:6px 0 14px; display:flex; align-items:center; gap:10px; }
  .form-sec-title::after { content:""; flex:1; height:1px; background:var(--border); }
  .fgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:16px; margin-bottom:24px; }
  .field { display:flex; flex-direction:column; gap:6px; }
  .field.col-2 { grid-column:span 2; }
  @media(max-width:520px){ .field.col-2{grid-column:span 1;} }
  .field label { font-size:12.5px; color:var(--text-soft); font-weight:500; }
  .field label .req { color:var(--red); }
  .field input, .field select { padding:10px 12px; border-radius:10px; border:1px solid var(--border); background:var(--bg-2); color:var(--text);
    font:inherit; font-size:14px; outline:none; transition:.2s; width:100%; }
  .field input:focus, .field select:focus { border-color:var(--border-strong); background:var(--bg-1); }
  .field input:read-only { color:var(--text-soft); background:rgba(255,255,255,.02); cursor:not-allowed; }
  .field .hint { font-size:11.5px; color:var(--text-dim); }
  .form-actions { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  .status-note { padding:12px 16px; border-radius:12px; font-size:13.5px; display:none; align-items:center; gap:10px; margin-bottom:20px; }
  .status-note.info { display:flex; color:#cfe2ff; background:rgba(100,181,255,.10); border:1px solid rgba(100,181,255,.3); }
  .status-note.exist { display:flex; color:#ffe9b0; background:rgba(255,215,110,.10); border:1px solid rgba(255,215,110,.3); }

  .notice { padding:16px 18px; border-radius:14px; border:1px solid var(--border); background:var(--surface); color:var(--text-soft); font-size:14px; line-height:1.6; }
  .notice.warn { color:#ffd3ad; background:rgba(255,157,92,.08); border-color:rgba(255,157,92,.3); }
  .empty { text-align:center; color:var(--text-dim); padding:40px 0; }
  .loading { display:flex; align-items:center; gap:12px; color:var(--text-soft); padding:30px 4px; }
  .spinner { width:20px; height:20px; border-radius:50%; border:2.5px solid var(--border-strong); border-top-color:var(--teal-1); animation:spin .8s linear infinite; }
  @keyframes spin { to{transform:rotate(360deg);} }

  /* toast */
  .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px); opacity:0; pointer-events:none;
    padding:13px 20px; border-radius:12px; background:var(--bg-2); border:1px solid var(--border-strong); color:var(--text);
    font-size:14px; font-weight:500; box-shadow:0 20px 50px -12px rgba(0,0,0,.8); transition:.3s; z-index:100; display:flex; align-items:center; gap:10px; }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  .toast .d { width:8px; height:8px; border-radius:50%; background:var(--green); }
  .toast.err .d { background:var(--red); }

  /* acciones en tabla */
  .row-actions { display:flex; gap:6px; }
  .iact { width:30px; height:30px; border-radius:8px; border:1px solid var(--border); background:var(--surface); color:var(--text-soft);
    cursor:pointer; display:grid; place-items:center; transition:.18s; }
  .iact svg { width:15px; height:15px; }
  .iact:hover { color:var(--text); background:var(--surface-strong); border-color:var(--border-strong); }
  .iact.del:hover { color:#ffc0c8; border-color:rgba(255,107,125,.4); background:rgba(255,107,125,.10); }
  .tag { display:inline-flex; align-items:center; font-size:10.5px; font-weight:600; padding:2px 7px; border-radius:6px; color:var(--text-soft); background:var(--surface); border:1px solid var(--border); }

  /* modal */
  .modal-overlay { position:fixed; inset:0; background:rgba(4,7,14,.62); backdrop-filter:blur(4px); display:flex; align-items:center; justify-content:center;
    padding:20px; z-index:200; opacity:0; transition:opacity .2s; }
  .modal-overlay.show { opacity:1; }
  .modal { width:100%; max-width:640px; max-height:90vh; overflow:auto; border-radius:18px; border:1px solid var(--border-strong);
    background:linear-gradient(160deg,var(--bg-2),var(--bg-1)); box-shadow:0 40px 90px -20px rgba(0,0,0,.85); transform:translateY(10px); transition:transform .2s; }
  .modal-overlay.show .modal { transform:translateY(0); }
  .modal-head { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:20px 24px; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--bg-2); }
  .modal-head h3 { margin:0; font-size:17px; font-weight:700; }
  .modal-x { width:34px; height:34px; border-radius:9px; border:1px solid var(--border); background:var(--surface); color:var(--text-soft); cursor:pointer; font-size:20px; line-height:1; display:grid; place-items:center; }
  .modal-x:hover { color:var(--text); background:var(--surface-strong); }
  .modal-body { padding:24px; }
  .modal-body .fgrid { margin-bottom:0; }
  .modal-foot { display:flex; gap:12px; justify-content:flex-end; padding:18px 24px; border-top:1px solid var(--border); flex-wrap:wrap; }
  .warn-box { display:flex; gap:12px; align-items:flex-start; padding:14px 16px; border-radius:12px; color:#ffc0c8; background:rgba(255,107,125,.08); border:1px solid rgba(255,107,125,.3); font-size:14px; line-height:1.5; }
  .btn-danger { color:#fff; background:linear-gradient(135deg,#ff6b7d,#ff9d5c); }
  .btn-danger:hover { filter:brightness(1.06); transform:translateY(-1px); }

  .footer { margin-top:40px; padding-top:18px; border-top:1px solid var(--border); display:flex; align-items:center; gap:10px; color:var(--text-dim); font-size:12.5px; flex-wrap:wrap; }
  .footer .sep { opacity:.5; }
  .legend { display:flex; gap:16px; flex-wrap:wrap; margin:14px 0 4px; font-size:12px; color:var(--text-soft); }
  .legend span { display:inline-flex; align-items:center; gap:6px; }
  .legend .d { width:8px; height:8px; border-radius:50%; }

  @media (max-width:720px){ :root{--sidebar-w:62px;} }
  @media (prefers-reduced-motion: reduce){ *{animation:none !important; transition:none !important;} }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

<div class="app">
  <aside class="sidebar">

/* ============================================================

   ============================================================ */
const $ = (s,el=document)=>el.querySelector(s);
const esc = (s)=> String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function norm(s){ return String(s==null?"":s).toUpperCase().normalize("NFD").replace(/[̀-ͯ]/g,"").trim(); }
function parseDate(s){ if(!s) return null; const [y,m,d]=String(s).split("-").map(Number); if(!y||!m||!d) return null; return new Date(y,m-1,d); }
function fmtDate(s){ const d=parseDate(s); if(!d) return "—"; return String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0")+"/"+d.getFullYear(); }
function today(){ const t=new Date(); return new Date(t.getFullYear(),t.getMonth(),t.getDate()); }
function daysBetween(a,b){ return Math.round((a-b)/86400000); }
function addMonths(d,m){ const y=d.getFullYear(),mo=d.getMonth(),day=d.getDate(); const t=new Date(y,mo+m,1); const last=new Date(t.getFullYear(),t.getMonth()+1,0).getDate(); t.setDate(Math.min(day,last)); return t; }
function fmtMoney(n){ if(n==null||isNaN(n)) return "—"; return "$"+Number(n).toLocaleString("es-EC"); }
let toastTimer;
function toast(msg,err){ const t=document.getElementById("toast"); document.getElementById("toastMsg").textContent=msg; t.classList.toggle("err",!!err); t.classList.add("show"); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("show"),3400); }

/* ---- Exportar CSV ---- */
function csvCell(v){ const s=String(v==null?"":v); return /[",\n;]/.test(s)? '"'+s.replace(/"/g,'""')+'"' : s; }
async function exportarCSV(nombre, headers, filas){
  const bom="﻿";
  const csv = bom + [headers.map(csvCell).join(";")].concat(filas.map(f=>f.map(csvCell).join(";"))).join("\r\n");
  let dl=null; try{ dl=await claude.use("downloads"); }catch(e){}
  if(!dl){ toast("La descarga no está disponible en esta vista.",true); return; }
  try{ const r=await dl.save({filename:nombre, data:csv}); if(r.status==="saved") toast("Archivo exportado: "+nombre); }
  catch(e){ if(e&&e.code==="declined") return; toast("No se pudo exportar: "+((e&&e.code)||"error"),true); }
}

/* ============================================================
   CÁLCULOS (misma lógica del Excel)
   ============================================================ */
const DIAS_LIMITE_6A = Math.round(6*365.25); // 2192 días ≈ 6 años (LOSEP)
function computePersona(p, periodos){
  const per = periodos.filter(x=>String(x.cedula)===String(p.cedula))
                      .sort((a,b)=> (parseDate(a.inicio)||0) - (parseDate(b.inicio)||0));
  const res = { ...p, periodos:per, nPeriodos:per.length };
  if(!per.length){
    return Object.assign(res,{institucionActual:"—", inicioPrimera:null, finActual:null,
      diasAcumulados:0, diasEfectivos:0, aniosAcumulados:0, fechaLimite:null, diasRestLimite:null, metodoLimite:null,
      estadoLimite:sem("gray","— Sin períodos"), diasRestComision:null, estadoComision:sem("gray","— Sin períodos"),
      continuidad:"—", servidorOcupa:"" });
  }
  const inicios = per.map(x=>parseDate(x.inicio)).filter(Boolean);
  const fines   = per.map(x=>parseDate(x.fin)).filter(Boolean);
  const inicioPrimera = new Date(Math.min(...inicios));
  const finActual = new Date(Math.max(...fines));
  const actual = per.reduce((a,b)=> (parseDate(b.fin)>parseDate(a.fin)?b:a));
  const diasAcumulados = per.reduce((s,x)=>{ const i=parseDate(x.inicio),f=parseDate(x.fin); return s+((i&&f)?daysBetween(f,i)+1:0); },0);
  const aniosAcumulados = Math.round(diasAcumulados/365.25*10)/10;
  const fechaLimite = addMonths(inicioPrimera,72);
  const T = today();
  const diasRestComision = daysBetween(finActual,T);
  // Continuidad: ¿regresó a la institución y volvió a salir? (interrupciones)
  const spanCalendario = daysBetween(finActual,inicioPrimera)+1;
  const interrumpida = Math.abs(diasAcumulados - spanCalendario) > 3;
  const continuidad = interrumpida ? "Con interrupciones" : "Continua";
  // Límite legal (6 años)
  let diasRestLimite, metodoLimite, fechaLimiteMostrar;
  if(interrumpida){
    // Se cuentan los días EFECTIVOS fuera de la institución (suma de períodos),
    // no el calendario corrido, porque hubo retornos a la institución.
    diasRestLimite = DIAS_LIMITE_6A - diasAcumulados;
    metodoLimite = "efectivos";
    fechaLimiteMostrar = null;
  } else {
    // Comisión continua: proyección de calendario (idéntica al Excel).
    diasRestLimite = daysBetween(fechaLimite,T);
    metodoLimite = "calendario";
    fechaLimiteMostrar = fechaLimite;
  }
  let el;
  if(diasRestLimite<=0) el=sem("red","🔴 Superó límite legal");
  else if(diasRestLimite<=180) el=sem("orange","🟠 Próximo al límite (6 años)");
  else if(diasRestLimite<=365) el=sem("yellow","🟡 Vigilar (< 1 año)");
  else el=sem("green","🟢 Dentro del límite");
  let ec;
  if(diasRestComision<0) ec=sem("red","🔴 Comisión vencida");
  else if(diasRestComision<=90) ec=sem("orange","🟠 Vence pronto (≤90 días)");
  else if(diasRestComision<=180) ec=sem("yellow","🟡 Próxima a vencer (≤180 días)");
  else ec=sem("green","🟢 Vigente");
  return Object.assign(res,{
    institucionActual: norm(actual.institucion)||"—",
    inicioPrimera, finActual, diasAcumulados, diasEfectivos:diasAcumulados, aniosAcumulados,
    fechaLimite: fechaLimiteMostrar, diasRestLimite, metodoLimite, estadoLimite:el,
    diasRestComision, estadoComision:ec,
    continuidad, servidorOcupa: norm(actual.servidorOcupa)||""
  });
}
function sem(color,label){ return {color,label}; }
function pill(st){ return `<span class="pill st-${st.color}"><span class="d"></span>${esc(st.label.replace(/^[🔴🟠🟡🟢]\s*/,""))}</span>`; }

let db=null, dbState="loading"; // loading | ready | unavailable

let comTab="resumen", personaFiltro="";

  try { db = await claude.use("db"); } catch(e){ db=null; }
  if(!db){ dbState="unavailable"; if(!viewComision.hidden) renderComision(); return; }
  try {
    db.collection("personas").onSnapshot(s=>{ personas = s.docs.map(d=>({id:d.id, ...d.data()})); dbState="ready"; if(!viewComision.hidden) renderComision(); },
      err=>{ console.warn("personas",err); });
    db.collection("periodos").onSnapshot(s=>{ periodos = s.docs.map(d=>({id:d.id, ...d.data()})); dbState="ready"; if(!viewComision.hidden) renderComision(); },
      err=>{ console.warn("periodos",err); });
  } catch(e){ dbState="unavailable"; if(!viewComision.hidden) renderComision(); }
}

function renderComision(){
  const rows = personas.map(p=>computePersona(p, periodos));
  const head = `
    <button class="back" id="backBtn"><svg viewBox="0 0 24 24" fill="none"><path d="M19 12H5M11 18l-6-6 6-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg> Volver al panel principal</button>
    <div class="dhead">
      <div class="dicon icon-violet"><svg viewBox="0 0 24 24" fill="none"><path d="M4 8h16a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M9 8V6a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M3 13h18M12 12v2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></div>
      <div><h1>Comisión de Servicios</h1><p>Registro y control de comisiones de servicio sin RMU otorgadas a otras instituciones del Estado. El límite legal (LOSEP) es de 6 años acumulados fuera de la institución.</p></div>
    </div>
    <div class="subtabs">
      <button class="subtab ${comTab==='resumen'?'active':''}" data-tab="resumen">Resumen</button>
      <button class="subtab ${comTab==='personas'?'active':''}" data-tab="personas">Base de Personas</button>
      <button class="subtab ${comTab==='periodos'?'active':''}" data-tab="periodos">Detalle de Períodos</button>
      <button class="subtab ${comTab==='registrar'?'active':''}" data-tab="registrar">Registrar comisión</button>
    </div>
    <div id="comBody"></div>`;
  viewComision.innerHTML = head;
  $("#backBtn").addEventListener("click", inicio);
  viewComision.querySelectorAll(".subtab").forEach(b=> b.addEventListener("click",()=>{ comTab=b.dataset.tab; renderComision(); }));

  const body = $("#comBody");
  if(dbState==="loading"){ body.innerHTML = `<div class="loading"><div class="spinner"></div> Conectando con el almacenamiento del sistema…</div>`; return; }
  if(dbState==="unavailable"){ body.innerHTML = `<div class="notice warn">No se pudo conectar con el almacenamiento en esta vista. Vuelve a abrir el sistema desde el enlace original o inténtalo de nuevo en unos segundos.</div>`; return; }

  if(comTab==="resumen")   renderResumen(body, rows);
  if(comTab==="personas")  renderPersonas(body, rows);
  if(comTab==="periodos")  renderPeriodos(body, rows);
  if(comTab==="registrar") renderRegistrar(body);
}

function renderResumen(body, rows){
  const nPersonas = rows.length;
  const venc = rows.filter(r=> r.estadoComision.color==="red" || r.estadoComision.color==="orange").length;
  const limite = rows.filter(r=> r.estadoLimite.color==="red" || r.estadoLimite.color==="orange").length;
  const sinServidor = rows.filter(r=>{ const s=norm(r.servidorOcupa); return !s || s.includes("INACTIVO") || s.includes("SIN REGISTRAR"); }).length;
  const rmuTotal = rows.reduce((s,r)=> s+(Number(r.rmu)||0),0);
  const instituciones = new Set(rows.map(r=>r.institucionActual).filter(x=>x&&x!=="—")).size;
  const ic = {
    people:`<svg viewBox="0 0 24 24" fill="none"><circle cx="9" cy="8" r="3" stroke="currentColor" stroke-width="1.7"/><path d="M3 20c0-3 2.5-5 6-5s6 2 6 5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M16 5a3 3 0 0 1 0 6M21 20c0-2.4-1.4-4.2-3.6-4.8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>`,
    alert:`<svg viewBox="0 0 24 24" fill="none"><path d="M12 4 2 20h20L12 4Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M12 10v4M12 17h.01" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>`,
    clock:`<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.7"/><path d="M12 7v5l3 2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>`,
    seat:`<svg viewBox="0 0 24 24" fill="none"><path d="M6 10V6a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v4M4 10h16v6H4zM7 16v3M17 16v3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
    money:`<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.7"/><path d="M12 7v10M9.5 9.5c0-1 1-1.6 2.5-1.6s2.5.7 2.5 1.7-1 1.4-2.5 1.4-2.5.5-2.5 1.5 1 1.6 2.5 1.6 2.5-.6 2.5-1.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>`,
    bank:`<svg viewBox="0 0 24 24" fill="none"><path d="M4 9 12 4l8 5M5 9v9M19 9v9M9 9v9M15 9v9M3 21h18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`
  };
  const tile = (accent,icClass,icon,num,lbl)=>`
    <div class="kpi k-accent-${accent}">
      <div class="k-top"><div class="k-ic icon-${icClass}">${icon}</div></div>
      <div class="k-num">${num}</div><div class="k-lbl">${lbl}</div>
    </div>`;
  body.innerHTML = `
    <div class="kpis">
      ${tile("teal","teal",ic.people,nPersonas,"Personas en comisión")}
      ${tile("red","amber",ic.clock,venc,"Comisiones vencidas o por vencer (≤90 días)")}
      ${tile("orange","amber",ic.alert,limite,"Cerca o sobre el límite legal de 6 años")}
      ${tile("violet","violet",ic.seat,sinServidor,"Partidas sin servidor registrado")}
      ${tile("blue","blue",ic.money,fmtMoney(rmuTotal),"RMU mensual total comprometido (referencial)")}
      ${tile("green","teal",ic.bank,instituciones,"Instituciones distintas receptoras")}
    </div>
    <div class="legend">
      <span><span class="d" style="background:var(--green)"></span>Vigente / dentro del límite</span>
      <span><span class="d" style="background:var(--yellow)"></span>Vigilar (≤1 año / ≤180 días)</span>
      <span><span class="d" style="background:var(--orange)"></span>Próximo a vencer (≤90–180 días)</span>
      <span><span class="d" style="background:var(--red)"></span>Vencida o superó el límite legal</span>
    </div>
    <div class="notice" style="margin-top:16px">
      <strong>Límite legal de 6 años.</strong> En comisiones <em>continuas</em> se proyecta por calendario (inicio de la 1ª comisión + 6 años). Cuando la persona <em>regresó a la institución y volvió a salir</em> (con interrupciones), el límite se calcula por los <strong>días efectivos fuera</strong> de la institución (suma de todos sus períodos), con un máximo de ${DIAS_LIMITE_6A} días ≈ 6 años.
    </div>`;
}

function limiteCell(r){
  if(r.metodoLimite==="efectivos")
    return `<span class="tag" title="Se mide por días efectivos fuera de la institución (hubo interrupciones). Máximo ${DIAS_LIMITE_6A} días ≈ 6 años.">Días efectivos</span>`;
  return r.fechaLimite? fmtDate(r.fechaLimite.toISOString().slice(0,10)) : "—";
}
function limiteTitle(r){
  if(r.diasRestLimite==null) return "";
  if(r.metodoLimite==="efectivos") return `${r.diasRestLimite} días efectivos restantes (de ${DIAS_LIMITE_6A} ≈ 6 años)`;
  return `Faltan ${r.diasRestLimite} días de calendario para el límite de 6 años`;
}
function personaRow(r,i){
  return `<tr>
    <td class="muted">${i+1}</td>
    <td class="nowrap">${esc(r.cedula)}</td>
    <td class="nombre">${esc(r.nombres)}</td>
    <td>${esc(r.cargo||"—")}</td>
    <td class="nowrap">${esc(r.grupo||"—")}</td>
    <td class="num">${fmtMoney(r.rmu)}</td>
    <td>${esc(r.institucionActual)}</td>
    <td class="num nowrap">${r.inicioPrimera?fmtDate(r.inicioPrimera.toISOString().slice(0,10)):"—"}</td>
    <td class="num nowrap">${r.finActual?fmtDate(r.finActual.toISOString().slice(0,10)):"—"}</td>
    <td class="num">${r.nPeriodos}</td>
    <td class="num" title="Días efectivos fuera de la institución">${r.diasAcumulados}</td>
    <td class="num">${r.aniosAcumulados}</td>
    <td class="num nowrap">${limiteCell(r)}</td>
    <td title="${esc(limiteTitle(r))}">${pill(r.estadoLimite)}</td>
    <td>${pill(r.estadoComision)}</td>
    <td class="nowrap ${r.continuidad==="Con interrupciones"?"muted":""}">${esc(r.continuidad)}</td>
    <td>${esc(r.servidorOcupa||"—")}</td>
    <td><div class="row-actions">
      <button class="iact" data-edit-persona="${esc(r.cedula)}" title="Editar datos de la persona"><svg viewBox="0 0 24 24" fill="none"><path d="M4 20h4L18.5 9.5a2 2 0 0 0-2.8-2.8L5 17v3Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg></button>
      <button class="iact del" data-del-persona="${esc(r.cedula)}" title="Eliminar persona y sus períodos"><svg viewBox="0 0 24 24" fill="none"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div></td>
  </tr>`;
}
function renderPersonas(body, rows){
  const svgExport = `<svg viewBox="0 0 24 24" fill="none"><path d="M12 3v12M8 11l4 4 4-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 21h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>`;
  body.innerHTML = `
    <div class="toolbar">
      <div class="search"><svg viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.6"/><path d="m20 20-3.5-3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <input type="text" id="buscarPersona" placeholder="Buscar por cédula o nombre…" value="${esc(personaFiltro)}"/></div>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn btn-ghost" id="btnExportPersonas">${svgExport} Exportar</button>
        <button class="btn btn-primary" id="btnNuevo"><svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg> Registrar comisión</button>
      </div>
    </div>
    <div class="tbl-wrap"><table>
      <thead><tr>
        <th>#</th><th>Cédula</th><th>Nombres</th><th>Cargo</th><th>Grupo</th><th class="num">RMU</th>
        <th>Institución actual (destino)</th><th class="num">Inicio 1ª</th><th class="num">Fin actual</th>
        <th class="num">N° Per.</th><th class="num">Días efec.</th><th class="num">Años</th>
        <th class="num">Límite legal</th><th>Estado límite</th><th>Estado comisión</th><th>Continuidad</th><th>Servidor que ocupa</th><th>Acciones</th>
      </tr></thead>
      <tbody id="tbodyPersonas"></tbody>
    </table></div>`;
  function redraw(){
    const q=norm(personaFiltro);
    const rs = personas.map(p=>computePersona(p,periodos))
      .filter(r=> !q || norm(r.cedula).includes(q) || norm(r.nombres).includes(q))
      .sort((a,b)=> norm(a.nombres).localeCompare(norm(b.nombres)));
    const tb=$("#tbodyPersonas");
    if(!rs.length){ tb.innerHTML = `<tr><td colspan="18"><div class="empty">${personas.length? "No hay coincidencias para la búsqueda." : "Aún no hay personas registradas. Usa “Registrar comisión” para empezar."}</div></td></tr>`; return; }
    tb.innerHTML = rs.map((r,i)=>personaRow(r,i)).join("");
  }
  redraw();
  $("#buscarPersona").addEventListener("input", e=>{ personaFiltro=e.target.value; redraw(); });
  $("#btnNuevo").addEventListener("click", ()=>{ comTab="registrar"; renderComision(); });
  $("#btnExportPersonas").addEventListener("click", ()=>{
    const rs = personas.map(p=>computePersona(p,periodos)).sort((a,b)=>norm(a.nombres).localeCompare(norm(b.nombres)));
    const headers=["Cédula","Nombres","Ciudad","Intendencia","Dirección","Cargo","Grupo","RMU","Institución actual","Inicio 1ª","Fin actual","N° períodos","Días efectivos","Años acumulados","Fecha límite legal","Días restantes al límite","Método límite","Estado límite","Estado comisión","Continuidad","Servidor que ocupa"];
    const filas = rs.map(r=>[r.cedula,r.nombres,r.ciudad,r.intendencia,r.direccion,r.cargo,r.grupo,r.rmu,r.institucionActual,
      r.inicioPrimera?r.inicioPrimera.toISOString().slice(0,10):"", r.finActual?r.finActual.toISOString().slice(0,10):"",
      r.nPeriodos, r.diasAcumulados, r.aniosAcumulados, r.fechaLimite?r.fechaLimite.toISOString().slice(0,10):"(por días efectivos)",
      r.diasRestLimite, r.metodoLimite, r.estadoLimite.label, r.estadoComision.label, r.continuidad, r.servidorOcupa]);
    exportarCSV("base_personas_comision.csv", headers, filas);
  });
  $("#tbodyPersonas").addEventListener("click", e=>{
    const ed=e.target.closest("[data-edit-persona]"), de=e.target.closest("[data-del-persona]");
    if(ed) editarPersona(ed.getAttribute("data-edit-persona"));
    else if(de) eliminarPersona(de.getAttribute("data-del-persona"));
  });
}

function renderPeriodos(body, rows){
  const all = periodos.slice().map(x=>{
    const per = personas.find(p=>String(p.cedula)===String(x.cedula));
    const i=parseDate(x.inicio), f=parseDate(x.fin);
    return { ...x, nombres: per? per.nombres : (x.nombres||"—"), dias:(i&&f)?daysBetween(f,i)+1:0 };
  }).sort((a,b)=> norm(a.nombres).localeCompare(norm(b.nombres)) || (parseDate(a.inicio)||0)-(parseDate(b.inicio)||0));
  // número de período por persona
  const counter={};
  all.forEach(x=>{ counter[x.cedula]=(counter[x.cedula]||0)+1; x.nPer=counter[x.cedula]; });
  const svgExport = `<svg viewBox="0 0 24 24" fill="none"><path d="M12 3v12M8 11l4 4 4-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 21h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>`;
  body.innerHTML = `
    <div class="toolbar">
      <div style="color:var(--text-soft);font-size:13.5px">Historial completo de renovaciones — una fila por cada período otorgado (${all.length} registros).</div>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn btn-ghost" id="btnExportPeriodos">${svgExport} Exportar</button>
        <button class="btn btn-primary" id="btnNuevo2"><svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg> Registrar comisión</button>
      </div>
    </div>
    <div class="tbl-wrap"><table>
      <thead><tr><th>Cédula</th><th>Nombres</th><th>Institución en el período</th><th class="num">Inicio</th><th class="num">Fin</th><th class="num">Días</th><th class="num">N° período</th><th>Servidor que ocupa</th><th>Acciones</th></tr></thead>
      <tbody id="tbodyPeriodos">${ all.length? all.map(x=>`
        <tr><td class="nowrap">${esc(x.cedula)}</td><td class="nombre">${esc(x.nombres)}</td><td>${esc(norm(x.institucion))}</td>
        <td class="num nowrap">${fmtDate(x.inicio)}</td><td class="num nowrap">${fmtDate(x.fin)}</td><td class="num">${x.dias}</td>
        <td class="num">${x.nPer}</td><td>${esc(norm(x.servidorOcupa)||"—")}</td>
        <td><div class="row-actions">
          <button class="iact" data-edit-periodo="${esc(x.id)}" title="Editar período"><svg viewBox="0 0 24 24" fill="none"><path d="M4 20h4L18.5 9.5a2 2 0 0 0-2.8-2.8L5 17v3Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg></button>
          <button class="iact del" data-del-periodo="${esc(x.id)}" title="Eliminar período"><svg viewBox="0 0 24 24" fill="none"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        </div></td></tr>`).join("")
        : `<tr><td colspan="9"><div class="empty">Aún no hay períodos registrados.</div></td></tr>` }</tbody>
    </table></div>`;
  $("#btnNuevo2").addEventListener("click", ()=>{ comTab="registrar"; renderComision(); });
  $("#btnExportPeriodos").addEventListener("click", ()=>{
    const headers=["Cédula","Nombres","Institución en el período","Inicio","Fin","Días","N° período","Servidor que ocupa"];
    const filas = all.map(x=>[x.cedula,x.nombres,norm(x.institucion),x.inicio,x.fin,x.dias,x.nPer,norm(x.servidorOcupa)]);
    exportarCSV("detalle_periodos_comision.csv", headers, filas);
  });
  const tbp=$("#tbodyPeriodos");
  if(tbp) tbp.addEventListener("click", e=>{
    const ed=e.target.closest("[data-edit-periodo]"), de=e.target.closest("[data-del-periodo]");
    if(ed) editarPeriodo(ed.getAttribute("data-edit-periodo"));
    else if(de) eliminarPeriodo(de.getAttribute("data-del-periodo"));
  });
}

function renderRegistrar(body){
  body.innerHTML = `
    <div class="form-card">
      <div id="statusNote" class="status-note"></div>
      <div class="form-sec-title">Datos del servidor</div>
      <div class="fgrid">
        <div class="field"><label>Cédula <span class="req">*</span></label><input id="f_cedula" inputmode="numeric" autocomplete="off" placeholder="Ej. 1712345678"/><span class="hint">Si ya existe, se completan sus datos automáticamente.</span></div>
        <div class="field col-2"><label>Nombres completos <span class="req">*</span></label><input id="f_nombres" placeholder="Apellidos y nombres"/></div>
        <div class="field"><label>Ciudad</label><input id="f_ciudad"/></div>
        <div class="field col-2"><label>Intendencia de origen</label><input id="f_intendencia"/></div>
        <div class="field col-2"><label>Dirección de origen</label><input id="f_direccion"/></div>
        <div class="field col-2"><label>Cargo</label><input id="f_cargo"/></div>
        <div class="field"><label>Grupo ocupacional</label><input id="f_grupo"/></div>
        <div class="field"><label>RMU (referencial)</label><input id="f_rmu" inputmode="numeric" placeholder="Ej. 1676"/></div>
        <div class="field col-2"><label>Dirección del servidor que ocupa la partida</label><input id="f_dirocupa"/></div>
      </div>
      <div class="form-sec-title">Datos del período / renovación</div>
      <div class="fgrid">
        <div class="field col-2"><label>Institución del período (destino) <span class="req">*</span></label><input id="f_institucion" placeholder="Institución receptora"/></div>
        <div class="field"><label>Fecha de inicio <span class="req">*</span></label><input id="f_inicio" type="date"/></div>
        <div class="field"><label>Fecha de fin <span class="req">*</span></label><input id="f_fin" type="date"/></div>
        <div class="field col-2"><label>Servidor que ocupa la partida</label><input id="f_servidor" placeholder="Nombre del servidor que ocupa la partida"/></div>
      </div>
      <div class="form-actions">
        <button class="btn btn-primary" id="btnGuardar"><svg viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg> Guardar registro</button>
        <button class="btn btn-ghost" id="btnLimpiar">Limpiar</button>
      </div>
    </div>`;

  const ids=["cedula","nombres","ciudad","intendencia","direccion","cargo","grupo","rmu","dirocupa","institucion","inicio","fin","servidor"];
  const F={}; ids.forEach(k=> F[k]=$("#f_"+k));
  const note=$("#statusNote");
  const personaFields=[F.nombres,F.ciudad,F.intendencia,F.direccion,F.cargo,F.grupo,F.rmu,F.dirocupa];

  function checkCedula(){
    const ced=F.cedula.value.trim();
    const ex = personas.find(p=>String(p.cedula)===ced);
    if(ex){
      F.nombres.value=ex.nombres||""; F.ciudad.value=ex.ciudad||""; F.intendencia.value=ex.intendencia||"";
      F.direccion.value=ex.direccion||""; F.cargo.value=ex.cargo||""; F.grupo.value=ex.grupo||"";
      F.rmu.value=ex.rmu!=null?ex.rmu:""; F.dirocupa.value=ex.dirServidorOcupa||"";
      personaFields.forEach(f=> f.readOnly=true);
      note.className="status-note exist";
      note.innerHTML=`<span>Renovación / extensión — la persona <strong>${esc(ex.nombres)}</strong> ya existe. Solo completa los datos del nuevo período.</span>`;
    } else {
      personaFields.forEach(f=> f.readOnly=false);
      if(ced){ note.className="status-note info"; note.innerHTML=`<span>Persona nueva — completa todos sus datos y el primer período.</span>`; }
      else { note.className="status-note"; note.innerHTML=""; }
    }
  }
  F.cedula.addEventListener("input", checkCedula);

  $("#btnLimpiar").addEventListener("click", ()=>{ ids.forEach(k=>{ F[k].value=""; F[k].readOnly=false; }); note.className="status-note"; note.innerHTML=""; });

  $("#btnGuardar").addEventListener("click", async ()=>{
    const ced=F.cedula.value.trim();
    if(!ced){ toast("Ingresa la cédula."); F.cedula.focus(); return; }
    if(!/^\d{6,10}$/.test(ced)){ toast("La cédula debe tener solo números (6 a 10 dígitos)."); F.cedula.focus(); return; }
    if(!F.nombres.value.trim()){ toast("Ingresa los nombres."); F.nombres.focus(); return; }
    if(!F.institucion.value.trim()){ toast("Ingresa la institución del período."); F.institucion.focus(); return; }
    if(!F.inicio.value){ toast("Ingresa la fecha de inicio."); F.inicio.focus(); return; }
    if(!F.fin.value){ toast("Ingresa la fecha de fin."); F.fin.focus(); return; }
    if(parseDate(F.fin.value) < parseDate(F.inicio.value)){ toast("La fecha de fin no puede ser anterior al inicio."); return; }
    if(!db){ toast("No hay conexión con el almacenamiento."); return; }

    const btn=$("#btnGuardar"); btn.disabled=true; const prev=btn.innerHTML; btn.innerHTML=`<div class="spinner" style="width:16px;height:16px;border-width:2px"></div> Guardando…`;
    try{
      const existe = personas.some(p=>String(p.cedula)===ced);
      if(!existe){
        await db.doc("personas/"+ced).set({
          cedula:ced, nombres:F.nombres.value.trim(), ciudad:F.ciudad.value.trim(),
          intendencia:F.intendencia.value.trim(), direccion:F.direccion.value.trim(),
          cargo:F.cargo.value.trim(), grupo:F.grupo.value.trim(),
          rmu: F.rmu.value.trim()? Number(F.rmu.value.trim().replace(/[^\d.]/g,"")) : "",
          dirServidorOcupa:F.dirocupa.value.trim()
        });
      } else if(F.dirocupa.value.trim()){
        try{ await db.doc("personas/"+ced).update({ dirServidorOcupa:F.dirocupa.value.trim() }); }catch(e){}
      }
      await db.collection("periodos").add({
        cedula:ced, institucion:F.institucion.value.trim(),
        inicio:F.inicio.value, fin:F.fin.value, servidorOcupa:F.servidor.value.trim(),
        creado:new Date().toISOString()
      });
      toast(existe? "Renovación registrada correctamente." : "Persona y período registrados correctamente.");
      comTab="personas"; renderComision();
    }catch(e){
      console.error(e); btn.disabled=false; btn.innerHTML=prev;
      toast("No se pudo guardar: "+(e&&e.code?e.code:"error")+". Intenta de nuevo.");
    }
  });
}

/* ============================================================
   EDITAR / ELIMINAR
   ============================================================ */
function inp(id,label,val,type){ return `<div class="field ${type==='full'?'col-2':''}"><label>${esc(label)}</label><input id="${id}" ${type==='date'?'type="date"':''} value="${esc(val==null?'':val)}"/></div>`; }

function editarPersona(ced){
  const p = personas.find(x=>String(x.cedula)===String(ced)); if(!p) return;
  openModal("Editar datos de la persona", `
    <div class="fgrid">
      <div class="field"><label>Cédula</label><input value="${esc(p.cedula)}" readonly/></div>
      ${inp("e_nombres","Nombres completos",p.nombres,"full")}
      ${inp("e_ciudad","Ciudad",p.ciudad)}
      ${inp("e_intendencia","Intendencia de origen",p.intendencia,"full")}
      ${inp("e_direccion","Dirección de origen",p.direccion,"full")}
      ${inp("e_cargo","Cargo",p.cargo,"full")}
      ${inp("e_grupo","Grupo ocupacional",p.grupo)}
      ${inp("e_rmu","RMU",p.rmu)}
      ${inp("e_dirocupa","Dirección del servidor que ocupa",p.dirServidorOcupa,"full")}
    </div>`,
    `<button class="btn btn-ghost" id="mCancel">Cancelar</button><button class="btn btn-primary" id="mSave">Guardar cambios</button>`);
  $("#mCancel").addEventListener("click", closeModal);
  $("#mSave").addEventListener("click", async ()=>{
    if(!db){ toast("Sin conexión con el almacenamiento.",true); return; }
    const btn=$("#mSave"); btn.disabled=true;
    try{
      await db.doc("personas/"+ced).update({
        nombres:$("#e_nombres").value.trim(), ciudad:$("#e_ciudad").value.trim(), intendencia:$("#e_intendencia").value.trim(),
        direccion:$("#e_direccion").value.trim(), cargo:$("#e_cargo").value.trim(), grupo:$("#e_grupo").value.trim(),
        rmu: $("#e_rmu").value.trim()? Number($("#e_rmu").value.trim().replace(/[^\d.]/g,"")) : "",
        dirServidorOcupa:$("#e_dirocupa").value.trim()
      });
      closeModal(); toast("Datos actualizados.");
    }catch(e){ btn.disabled=false; toast("No se pudo guardar: "+((e&&e.code)||"error"),true); }
  });
}

function eliminarPersona(ced){
  const p = personas.find(x=>String(x.cedula)===String(ced)); if(!p) return;
  const pers = periodos.filter(x=>String(x.cedula)===String(ced));
  openModal("Eliminar persona", `
    <div class="warn-box"><svg viewBox="0 0 24 24" fill="none" style="width:22px;height:22px;flex:none"><path d="M12 4 2 20h20L12 4Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M12 10v4M12 17h.01" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      <div>Vas a eliminar a <strong>${esc(p.nombres)}</strong> (${esc(p.cedula)}) y sus <strong>${pers.length}</strong> período(s) registrado(s). Esta acción no se puede deshacer.</div></div>`,
    `<button class="btn btn-ghost" id="mCancel">Cancelar</button><button class="btn btn-danger" id="mDel">Sí, eliminar</button>`);
  $("#mCancel").addEventListener("click", closeModal);
  $("#mDel").addEventListener("click", async ()=>{
    if(!db){ toast("Sin conexión con el almacenamiento.",true); return; }
    const btn=$("#mDel"); btn.disabled=true;
    try{
      for(const per of pers){ await db.doc("periodos/"+per.id).delete(); }
      await db.doc("personas/"+ced).delete();
      closeModal(); toast("Persona eliminada.");
    }catch(e){ btn.disabled=false; toast("No se pudo eliminar: "+((e&&e.code)||"error"),true); }
  });
}

function editarPeriodo(id){
  const x = periodos.find(z=>String(z.id)===String(id)); if(!x) return;
  const per = personas.find(p=>String(p.cedula)===String(x.cedula));
  openModal("Editar período", `
    <div style="color:var(--text-soft);font-size:13px;margin-bottom:16px">${esc(per?per.nombres:x.cedula)} — ${esc(x.cedula)}</div>
    <div class="fgrid">
      ${inp("p_institucion","Institución del período (destino)",x.institucion,"full")}
      ${inp("p_inicio","Fecha de inicio",x.inicio,"date")}
      ${inp("p_fin","Fecha de fin",x.fin,"date")}
      ${inp("p_servidor","Servidor que ocupa la partida",x.servidorOcupa,"full")}
    </div>`,
    `<button class="btn btn-ghost" id="mCancel">Cancelar</button><button class="btn btn-primary" id="mSave">Guardar cambios</button>`);
  $("#mCancel").addEventListener("click", closeModal);
  $("#mSave").addEventListener("click", async ()=>{
    if(!db){ toast("Sin conexión con el almacenamiento.",true); return; }
    const ini=$("#p_inicio").value, fin=$("#p_fin").value;
    if(!$("#p_institucion").value.trim()){ toast("Ingresa la institución.",true); return; }
    if(!ini||!fin){ toast("Ingresa las fechas.",true); return; }
    if(parseDate(fin)<parseDate(ini)){ toast("La fecha de fin no puede ser anterior al inicio.",true); return; }
    const btn=$("#mSave"); btn.disabled=true;
    try{
      await db.doc("periodos/"+id).update({ institucion:$("#p_institucion").value.trim(), inicio:ini, fin:fin, servidorOcupa:$("#p_servidor").value.trim() });
      closeModal(); toast("Período actualizado.");
    }catch(e){ btn.disabled=false; toast("No se pudo guardar: "+((e&&e.code)||"error"),true); }
  });
}

function eliminarPeriodo(id){
  const x = periodos.find(z=>String(z.id)===String(id)); if(!x) return;
  const per = personas.find(p=>String(p.cedula)===String(x.cedula));
  const restantes = periodos.filter(z=>String(z.cedula)===String(x.cedula)).length;
  openModal("Eliminar período", `
    <div class="warn-box"><svg viewBox="0 0 24 24" fill="none" style="width:22px;height:22px;flex:none"><path d="M12 4 2 20h20L12 4Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M12 10v4M12 17h.01" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      <div>Vas a eliminar el período de <strong>${esc(per?per.nombres:x.cedula)}</strong> en <strong>${esc(norm(x.institucion))}</strong> (${esc(fmtDate(x.inicio))} – ${esc(fmtDate(x.fin))}). Esta acción no se puede deshacer.${restantes<=1?'<br><br><em>Es su único período; la persona quedará sin períodos (usa “Eliminar persona” si deseas quitarla por completo).</em>':''}</div></div>`,
    `<button class="btn btn-ghost" id="mCancel">Cancelar</button><button class="btn btn-danger" id="mDel">Sí, eliminar</button>`);
  $("#mCancel").addEventListener("click", closeModal);
  $("#mDel").addEventListener("click", async ()=>{
    if(!db){ toast("Sin conexión con el almacenamiento.",true); return; }
    const btn=$("#mDel"); btn.disabled=true;
    try{ await db.doc("periodos/"+id).delete(); closeModal(); toast("Período eliminado."); }
    catch(e){ btn.disabled=false; toast("No se pudo eliminar: "+((e&&e.code)||"error"),true); }
  });
}

renderHome();
initDB();
